<style>

  .table {

  }

  }

  }

  .table > tbody > tr > td {
    border-top: 1px solid rgba(255, 255, 255, 0.05) !important;

  h2 {

    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .form-control:focus {
